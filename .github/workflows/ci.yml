name: CI

on:
  push:
    branches: [main, development, staging]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # veneko shells out to platform tools and builds paths per OS, so a
        # single-platform run would miss exactly the bugs worth catching.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor declared in engines, and the current LTS.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built CLI runs
        run: node dist/index.js --version

      - name: Verify the templates were bundled
        shell: bash
        run: test -d dist/templates/nextjs || (echo "templates missing from dist" && exit 1)

  installers:
    name: Lint the installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the shell installers
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          shellcheck --severity=warning scripts/install.sh scripts/uninstall.sh

      - name: Check the PowerShell installers
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/uninstall.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Host "$file : $($_.Extent.StartLineNumber) : $($_.Message)" }
              exit 1
            }
            Write-Host "$file parses cleanly"
          }
