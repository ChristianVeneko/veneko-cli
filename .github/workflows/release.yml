name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tag builds everywhere
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --version

  release:
    name: Publish the release
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve the tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.tag }} does not match package.json version $PKG_VERSION."
            echo "Bump package.json before tagging, or the installed CLI will report the wrong version."
            exit 1
          fi
          echo "package.json and the tag both say $PKG_VERSION"

      - name: Build the prebuilt bundle
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # A convenience artifact for anyone who wants to skip the build step.
      # The installers do not use it: they build from the source zip GitHub
      # attaches automatically, which is what keeps the flow auditable.
      - name: Package the prebuilt bundle
        run: |
          tar -czf "veneko-cli-${{ steps.tag.outputs.version }}-dist.tar.gz" \
            dist package.json package-lock.json scripts README.md LICENSE

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: veneko ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: veneko-cli-${{ steps.tag.outputs.version }}-dist.tar.gz
          body: |
            ## Instalación

            **macOS y Linux**

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```

            **Windows (PowerShell)**

            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            ```

            Si ya tenés veneko instalado, actualizá con `veneko update`.

            El instalador toma el **Source code (zip)** de abajo, lo compila y
            deja `veneko` en tu PATH. Requiere Node.js 20 o superior.

            ---
